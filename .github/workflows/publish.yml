name: Publish articles

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish article to Qiita
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qiita_success: ${{ steps.publish_qiita.outcome == 'success' || steps.retry_publish_qiita.outcome == 'success' }}
      title: ${{ steps.get_info.outputs.title || '' }}
      url: ${{ steps.get_info.outputs.url || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish article to Qiita
        id: publish_qiita
        continue-on-error: true
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."

      - name: Remove updated_at from frontmatter on failure
        if: steps.publish_qiita.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -d "public" ]; then
            find public -type f -name '*.md' -print0 | while IFS= read -r -d '' file; do
              awk '
                { sub(/\r$/, "") }
                /^---$/ { fm++; print; next }
                fm == 1 && /^updated_at:/ { next }
                { print }
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            done
          fi

      - name: Retry publish article to Qiita
        id: retry_publish_qiita
        if: steps.publish_qiita.outcome == 'failure'
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."

      - name: Get published info
        id: get_info
        if: steps.publish_qiita.outcome == 'success' || steps.retry_publish_qiita.outcome == 'success'
        run: |
          set -euo pipefail

          # 直近コミット（qiita-cli による自動コミット含む）から更新された public/ 配下の記事ファイルを抽出
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILE=$(git -c core.quotepath=false diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'public/*.md' | head -n 1 || true)
          else
            CHANGED_FILE=$(git -c core.quotepath=false ls-files -- 'public/*.md' | head -n 1 || true)
          fi

          if [ -z "${CHANGED_FILE}" ] || [ ! -f "${CHANGED_FILE}" ]; then
            {
              printf 'title=%s\n' "記事一覧を更新"
              printf 'url=%s\n' "https://qiita.com/"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # フロントマターから title と id を抽出（存在しない場合はフォールバック）
          TITLE=$(awk '
            { sub(/\r$/, "") }
            /^---$/ { fm++; next }
            fm == 1 && /^title:[[:space:]]*/ {
              sub(/^title:[[:space:]]*/, "")
              gsub(/^["'\'']|["'\'']$/, "")
              print
              exit
            }
          ' "${CHANGED_FILE}")

          ARTICLE_ID=$(awk '
            { sub(/\r$/, "") }
            /^---$/ { fm++; next }
            fm == 1 && /^id:[[:space:]]*/ {
              sub(/^id:[[:space:]]*/, "")
              gsub(/^["'\'']|["'\'']$/, "")
              print
              exit
            }
          ' "${CHANGED_FILE}")

          if [ -z "${TITLE}" ]; then
            TITLE=$(basename "${CHANGED_FILE}" .md)
          fi

          if [ -n "${ARTICLE_ID}" ] && [ "${ARTICLE_ID}" != "null" ]; then
            URL="https://qiita.com/items/${ARTICLE_ID}"
          else
            URL="https://qiita.com/"
          fi

          {
            printf 'title=%s\n' "${TITLE}"
            printf 'url=%s\n' "${URL}"
          } >> "$GITHUB_OUTPUT"
